ShortDescription: High-performance, lightweight Windows Explorer 3D & CAD preview extension with Spacebar QuickLook and 18 formats.
Description: ModelPeek is a native Windows Explorer 64-bit shell extension and QuickLook utility for CAD and 3D models. It generates realistic 3D thumbnails in Windows Explorer folders, provides interactive preview in the preview pane (Alt+P) and standalone floating Spacebar QuickLook, featuring 3D bounding box dimension annotations, cross-sectioning, and assembly tree inspection.
