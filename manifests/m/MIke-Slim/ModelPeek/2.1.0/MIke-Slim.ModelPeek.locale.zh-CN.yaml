Description: ModelPeek 是一款专为工程设计师与 3D 创作者打造的 Windows 资源管理器原生扩展插件。支持在文件夹中秒级生成立体 3D 缩略图、预览窗格 (Alt+P) 交互式查看与空格键 (Space) 沉浸式快速预览，内置三维工程尺寸标注、零部件装配树、动态剖切面及四大视口主题。
